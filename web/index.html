<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jellyfield Particle Studio</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#07121f; color:#e8faff; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; }
    main { width:min(960px,92vw); display:grid; grid-template-columns:1fr 280px; gap:20px; }
    canvas { width:100%; aspect-ratio:16/10; background:#0b2030; border:1px solid #23516a; }
    aside { padding:18px; border:1px solid #23516a; background:#0b1a28; }
    label { display:block; margin-top:16px; font-size:.9rem; }
    input,button { width:100%; margin-top:8px; padding:9px; box-sizing:border-box; }
    button { background:#37d9ef; border:0; color:#06202a; font-weight:700; cursor:pointer; }
    output { display:block; margin-top:18px; color:#9cefff; }
  </style>
</head>
<body>
<main>
  <canvas id="field" width="800" height="500"></canvas>
  <aside>
    <h1>Jellyfield</h1>
    <label>Selected jellyfish<select id="target"><option value="jelly-a">Aurora</option><option value="jelly-b">Lumen</option><option value="jelly-c">Pulse</option></select></label>
    <label>Speed<input id="speed" type="range" min="0.1" max="8" step="0.1" value="1.2"></label>
    <label>Glow color<input id="color" type="color" value="#28dcff"></label>
    <button id="apply">Apply controls</button>
    <output id="status">Frame 0</output>
  </aside>
</main>
<script>
  const canvas=document.querySelector('#field'),ctx=canvas.getContext('2d');
  const jelly=[{id:'jelly-a',x:220,y:210,speed:1.2,color:'#28dcff'},{id:'jelly-b',x:470,y:270,speed:2.4,color:'#a05aff'},{id:'jelly-c',x:640,y:160,speed:.8,color:'#5affb4'}];let frame=0;
  function draw(){frame++;ctx.clearRect(0,0,800,500);for(const j of jelly){ctx.save();ctx.translate(j.x,j.y);ctx.shadowBlur=24;ctx.shadowColor=j.color;ctx.fillStyle=j.color;ctx.beginPath();ctx.arc(0,0,22+Math.sin(frame*.05*j.speed)*3,Math.PI,0);ctx.fill();for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(-16+i*6,3);ctx.quadraticCurveTo(-20+i*8,25+Math.sin(frame*.06*j.speed+i)*5,-18+i*7,42);ctx.strokeStyle=j.color;ctx.lineWidth=3;ctx.stroke()}ctx.restore()}document.querySelector('#status').textContent=`Frame ${frame}`;requestAnimationFrame(draw)}
  document.querySelector('#apply').onclick=()=>{const j=jelly.find(v=>v.id===document.querySelector('#target').value);j.speed=+document.querySelector('#speed').value;j.color=document.querySelector('#color').value};draw();
</script>
</body>
</html>
